<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Seen helps adolescents organize period-pain experiences and prepare for a healthcare conversation."
    />
    <meta name="theme-color" content="#fffaf5" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23563755'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='42' fill='%23fffaf5'%3ES%3C/text%3E%3C/svg%3E"
    />
    <title>Seen | A Period-Pain Conversation Companion</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header screen-only">
      <a
        class="wordmark"
        href="#"
        data-action="go-intro"
        aria-label="Seen home"
      >
        <span aria-hidden="true">S</span>
        <strong>Seen</strong>
      </a>
      <nav aria-label="Project navigation">
        <button class="nav-link" type="button" data-action="go-intro">
          Introduction
        </button>
        <button class="nav-link" type="button" data-action="show-about">
          About the design
        </button>
        <button class="nav-link" type="button" data-action="show-sources">
          Sources
        </button>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">
      <div id="app"></div>
    </main>

    <div
      id="announcer"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="undo-region"
      class="undo-region screen-only"
      aria-live="polite"
    ></div>

    <dialog
      id="confirm-dialog"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-copy"
    >
      <form method="dialog" class="dialog-panel">
        <p class="eyebrow">Before you continue</p>
        <h2 id="dialog-title">Clear your answers?</h2>
        <p id="dialog-copy"></p>
        <div class="dialog-actions">
          <button class="button button-secondary" value="cancel">
            Keep my answers
          </button>
          <button class="button button-danger" value="confirm">
            Clear and continue
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
